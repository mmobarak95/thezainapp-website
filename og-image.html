<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Zain — share image (1200 × 630)</title>
<!--
  The source for assets/brand/share.png. Open it at exactly 1200 × 630 and
  screenshot the .card, or re-export with:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot=assets/brand/share.png \
      http://localhost:4321/og-image.html

  Keep it the hero: the two lines, one phone, paper.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #E7E2D8; font-family: Georgia, "Times New Roman", serif; color: #0A3F42; }
  .card {
    width: 1200px; height: 630px; background: #FAF7F2;
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 1fr 340px;
    gap: 56px; align-items: center;
    padding: 64px 72px;
  }
  .eyebrow {
    font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 600; color: #4E6A6C; margin-bottom: 34px;
  }
  h1 { font-size: 51px; line-height: 1.14; letter-spacing: -.018em; font-weight: 400; max-width: 15ch; }
  h2 { font-size: 51px; line-height: 1.14; letter-spacing: -.018em; font-weight: 400; color: #6E1E2B; margin-top: 16px; max-width: 16ch; }
  .foot {
    margin-top: 40px;
    font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 600; color: #4E6A6C;
  }
  .phone {
    background: #0b0b0b; border-radius: 40px; padding: 9px;
    box-shadow: 0 30px 60px rgba(62, 42, 30, .28), 0 2px 6px rgba(0, 0, 0, .25);
    width: 318px; margin-left: auto;
  }
  .phone img { display: block; width: 100%; border-radius: 32px; }
  .terrain { position: absolute; left: 0; bottom: 0; width: 1200px; height: 40px; }
</style>
</head>
<body>
<div class="card">
  <div>
    <p class="eyebrow">Zain &middot; habits, journal, books, training</p>
    <h1>Making the plan was never the hard part.</h1>
    <h2>Zain makes a plan that moves with you.</h2>
    <p class="foot">thezainapp.com</p>
  </div>
  <div class="phone"><img src="assets/clips/type-marathon.jpg" alt="" /></div>
  <svg class="terrain" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
    <polyline id="line" fill="none" stroke="#B8985A" stroke-width="1.4" />
  </svg>
</div>
<script>
  const W = 1200, AMP = 13;
  const y = (t) => 20 - AMP * (0.55 * Math.sin(t * 5.6) + 0.45 * Math.sin(t * 2.1 + 0.7));
  const pts = [];
  for (let i = 0; i <= W; i += 8) pts.push(`${i},${y(i / W).toFixed(2)}`);
  document.getElementById('line').setAttribute('points', pts.join(' '));
</script>
</body>
</html>
