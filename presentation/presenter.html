<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Presenter</title>
<style>
body{margin:0;background:#0A3F42;color:#FAF7F2;font-family:Georgia,serif;height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 28px 8px;border-bottom:1px solid rgba(184,152,90,.5)}
#clock{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#clock.over{color:#F0B7A4}
#pg{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#B8985A}
main{padding:18px 28px;overflow:auto}
#title{font-size:30px;margin:0 0 12px;color:#FAF7F2}
.line{font-size:23px;line-height:1.45;margin:0 0 14px;color:rgba(250,247,242,.92)}
.line b{color:#B8985A;font-weight:normal}
#next{border-top:1px solid rgba(184,152,90,.5);padding:12px 28px 18px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;color:rgba(250,247,242,.7)}
#next b{color:#B8985A;letter-spacing:.14em;text-transform:uppercase;font-size:11px;display:block;margin-bottom:4px}
kbd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:11px;color:#B8985A}
</style></head>
<body>
<header><div id="pg">page 1 · step 0</div><div id="clock">0:00</div></header>
<main><h1 id="title"></h1><div id="lines"></div></main>
<div id="next"><b>Next</b><span id="nexttxt"></span><div style="margin-top:8px"><kbd>→ / space next · ← back · t start clock · r replay · f fullscreen (deck window)</kbd></div></div>
<script src="script.js"></script>
<script>
const bc=new BroadcastChannel('zain-live');let state={page:0,step:0,t0:null,total:SCRIPT.length};
function render(){const s=SCRIPT[state.page]||{title:'',lines:[]};document.getElementById('title').textContent=`${state.page+1}. ${s.title}`;
 document.getElementById('lines').innerHTML=s.lines.map(l=>`<p class="line">${l.replace(/\((.*?)\)/g,'<b>($1)</b>')}</p>`).join('');
 const n=SCRIPT[state.page+1];document.getElementById('nexttxt').textContent=n?`${state.page+2}. ${n.title}: ${n.lines[0]}`:'End. Hold the last line.';
 document.getElementById('pg').textContent=`page ${state.page+1} of ${state.total} · step ${state.step}${state.max?` of ${state.max}`:''}`;}
function tick(){const el=document.getElementById('clock');if(!state.t0){el.textContent='0:00';el.classList.remove('over');return}const s=Math.floor((Date.now()-state.t0)/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;el.classList.toggle('over',s>=290);}
bc.onmessage=ev=>{const m=ev.data||{};if(m.type==='state'){state=m;render();}};
setInterval(tick,250);render();bc.postMessage({type:'cmd',cmd:'hello'});
window.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();bc.postMessage({type:'cmd',cmd:'next'})}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();bc.postMessage({type:'cmd',cmd:'prev'})}else if(k==='t'){bc.postMessage({type:'cmd',cmd:'clock'})}else if(k==='Home'){bc.postMessage({type:'cmd',cmd:'reset'})}});
</script></body></html>
